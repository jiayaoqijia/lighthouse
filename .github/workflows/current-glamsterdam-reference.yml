name: Complete current Glamsterdam reference
on:
  pull_request:
    branches: [eth2030]
    paths:
      - 'consensus/**'
      - 'beacon_node/**'
      - 'crypto/**'
      - 'testing/ef_tests/**'
      - 'Cargo.lock'
      - '.github/workflows/current-glamsterdam-reference.yml'
  workflow_dispatch:
jobs:
  current-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: 1
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CURRENT_INPUTS: ${{ runner.temp }}/current-inputs
      CURRENT_BINARIES: ${{ runner.temp }}/current-binaries
      CURRENT_RESULTS: ${{ runner.temp }}/current-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libclang-dev cmake protobuf-compiler
      - name: Test strict inventory and prepare unchanged source inputs
        run: |
          python testing/ef_tests/test_current_reference.py
          python testing/ef_tests/test_source_pinned_fcr.py
          python testing/ef_tests/current_reference.py prepare "$CURRENT_INPUTS"
      - name: Install exact reference test dependencies and generate executable specs
        run: |
          python -m pip install "$CURRENT_INPUTS/reference[test]"
          cd "$CURRENT_INPUTS/reference"
          python -m pysetup.generate_specs --all-forks
      - name: Independently regenerate all SSZ vectors and check every input byte
        run: python testing/ef_tests/current_reference.py regenerate-ssz "$CURRENT_INPUTS"
      - name: Build immutable real and explicit synthetic crypto consumers
        run: python testing/ef_tests/current_reference.py build "$CURRENT_BINARIES"
      - name: Consume all 12195 full-node and historical compatibility cases without waivers
        run: python testing/ef_tests/current_reference.py run "$CURRENT_INPUTS" "$CURRENT_BINARIES" "$CURRENT_RESULTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-glamsterdam-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/current-results/*.json
            ${{ runner.temp }}/current-results/*.log
            ${{ runner.temp }}/current-binaries/*.json
            ${{ runner.temp }}/current-binaries/*-build.log
            ${{ runner.temp }}/current-inputs/ssz-generation.*
            ${{ runner.temp }}/current-inputs/ssz-generation-receipt.json
          if-no-files-found: error
          retention-days: 30
